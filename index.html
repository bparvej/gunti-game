<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bangla Guti Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; background: #1a1a2e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; overflow: hidden; touch-action: manipulation; }

    #game { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    canvas { touch-action: none; max-width: 100vw; max-height: 100vh; }

    /* ── Move Slider (only DOM element visible) ── */
    #move-slider-wrap {
      position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: 260px; background: rgba(255,255,255,0.96); border-radius: 14px;
      padding: 12px 16px; display: none;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35); z-index: 10;
      backdrop-filter: blur(8px);
    }
    #move-slider-wrap label { font-size: 13px; color: #333; display: block; margin-bottom: 6px; text-align: center; font-weight: 600; }
    #move-slider-wrap input[type=range] { width: 100%; accent-color: #ff5252; }
    .slider-btns { display: flex; gap: 8px; margin-top: 8px; }
    .slider-btns button {
      flex: 1; padding: 8px; border: none; border-radius: 8px; cursor: pointer;
      color: #fff; font-weight: 700; font-size: 13px; letter-spacing: 0.3px;
    }
    #btn-move { background: linear-gradient(135deg, #ff7f50, #ff5252); }
    #btn-cancel-move { background: #888; }

    /* ── Settings Panel (rendered in Phaser canvas, but scrollable via this wrapper if needed) ── */
    #settings-scroll {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 320px; max-height: 80vh; overflow-y: auto; display: none;
      z-index: 100; -webkit-overflow-scrolling: touch;
    }

    /* ── Mobile adjustments ── */
    @media (max-width: 480px) {
      #move-slider-wrap { width: calc(100% - 32px); bottom: 8px; padding: 10px 14px; }
      canvas { width: 100vw !important; height: 100vh !important; }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      #move-slider-wrap { width: 280px; }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Mobile move slider -->
  <div id="move-slider-wrap">
    <label id="slider-label">Select move</label>
    <input id="move-slider" type="range" min="0" max="0" value="0" />
    <div class="slider-btns">
      <button id="btn-move">MOVE</button>
      <button id="btn-cancel-move">CANCEL</button>
    </div>
  </div>

  <!-- Hidden file input for background image upload -->
  <input type="file" id="bg-image-input" accept="image/*" style="display:none" />

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
