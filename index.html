<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangla Guti Game</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #1a1a2e; font-family: Arial, sans-serif; overflow: hidden; }
    #game { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; touch-action: none; }
    canvas { touch-action: none; }

    #move-slider-wrap {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      width: 260px; background: rgba(255,255,255,0.95); border-radius: 12px;
      padding: 10px 14px; display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      z-index: 10;
    }
    #move-slider-wrap label { font-size: 13px; color: #333; display: block; margin-bottom: 4px; text-align: center; }
    #move-slider-wrap input[type=range] { width: 100%; }
    #move-slider-wrap .slider-btns { display: flex; gap: 8px; margin-top: 6px; }
    #move-slider-wrap .slider-btns button {
      flex: 1; padding: 6px; border: none; border-radius: 6px; cursor: pointer;
      color: #fff; font-weight: bold; font-size: 13px;
    }
    #btn-move { background: linear-gradient(90deg, #ff7f50, #ff5252); }
    #btn-cancel-move { background: #999; }

    @media (max-width: 480px) {
      #move-slider-wrap { width: calc(100% - 24px); }
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="move-slider-wrap">
    <label id="slider-label">Select move</label>
    <input id="move-slider" type="range" min="0" max="0" value="0" />
    <div class="slider-btns">
      <button id="btn-move">MOVE</button>
      <button id="btn-cancel-move">CANCEL</button>
    </div>
  </div>

  <input type="file" id="bg-image-input" accept="image/*" style="display:none" />

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
